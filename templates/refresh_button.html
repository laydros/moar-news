{% if refreshing %}
{% if let Some(updated) = last_updated %}
<span class="last-updated" data-timestamp="{{ updated }}"></span>
{% else %}
<span class="last-updated"></span>
{% endif %}
<button
    hx-get="/refresh/status"
    hx-target="#refresh-container"
    hx-swap="innerHTML"
    hx-trigger="load delay:2s"
    class="refresh-btn refreshing"
    disabled
>
    Refreshing...
</button>
{% else %}
{% if let Some(updated) = last_updated %}
<span class="last-updated" data-timestamp="{{ updated }}"></span>
{% else %}
<span class="last-updated"></span>
{% endif %}
<button
    hx-post="/refresh"
    hx-target="#refresh-container"
    hx-swap="innerHTML"
    class="refresh-btn"
>
    Refresh All
</button>
{% endif %}
